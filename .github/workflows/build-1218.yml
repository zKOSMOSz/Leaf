name: Build Release Jar

on:
  workflow_dispatch:
  push:
    branches: [ "ver/1.21.8" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Build and install Leavesclip to mavenLocal
        run: |
          git clone --depth 1 https://github.com/LeavesMC/Leavesclip /tmp/Leavesclip
          (cd /tmp/Leavesclip && ./gradlew publishToMavenLocal -x test --no-daemon)

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Git identity (required by paperweight patch apply)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Build mojmap paperclip jar
        run: ./gradlew :leaf-server:createMojmapPaperclipJar --stacktrace --no-daemon

      - name: Upload Leaf jar
        uses: actions/upload-artifact@v4
        with:
          name: Leaf-1.21.8
          path: leaf-server/build/libs/leaf-paperclip-1.21.8-R0.1-SNAPSHOT-mojmap.jar
