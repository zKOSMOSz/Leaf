name: Build Release Jar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - run: ./gradlew createMojmapPaperclipJar --stacktrace --no-daemon
