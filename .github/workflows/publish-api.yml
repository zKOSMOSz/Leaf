name: Publish API (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew applyAllPatches :leaf-api:publishToMavenLocal --stacktrace --no-daemon
