name: Publish API (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Configure Git identity (required by paperweight patch apply)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: ./gradlew applyAllPatches :leaf-api:publishToMavenLocal --stacktrace --no-daemon
